# =============================================================================
# Scoring rules – rating scales and outcome policies.
# Legal values are kept in configuration so that a change of regulation does not
# require code changes (only this file).
# =============================================================================

levels:
  - { points: 1, key: significantly_below, label: "Znacznie poniżej oczekiwań" }
  - { points: 3, key: below,               label: "Poniżej oczekiwań" }
  - { points: 5, key: meets,               label: "Na poziomie oczekiwań" }
  - { points: 7, key: above,               label: "Powyżej oczekiwań" }
  - { points: 9, key: significantly_above, label: "Znacznie powyżej oczekiwań" }

scales:
  periodic: [1, 3, 5, 7, 9]   # § 11 ust. 1 pkt 1 rozporządzenia z 2016 r.
  first: [3, 5, 7]            # § 9 ust. 1 rozporządzenia z 2015 r.

policies:
  periodic:
    provider: periodic_2016
    params:
      # § 11 ust. 1 pkt 2 – overall level from arithmetic mean (upper bound inclusive)
      overall_bands:
        - { up_to: 2.0, points: 1 }
        - { up_to: 4.0, points: 3 }
        - { up_to: 6.0, points: 5 }
        - { up_to: 8.0, points: 7 }
        - { up_to: 9.0, points: 9 }
      positive_min_overall_points: 5   # § 11 ust. 1 pkt 3
      negative_if_any_partial: 1       # § 11 ust. 1 pkt 4
      decimals: 2

  first:
    provider: first_2015
    params:
      min_average: 5.0                 # § 10 ust. 1 pkt 4
      lowest_partial: 3
      max_lowest_partials: 1           # § 10 ust. 1 pkt 3
      decimals: 2

