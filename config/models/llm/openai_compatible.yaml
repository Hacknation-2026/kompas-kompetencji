# Any OpenAI-compatible chat-completions endpoint (Groq, OpenRouter, LM Studio, vLLM, Azure gateway...).
provider: openai_compatible
params:
  base_url: https://api.groq.com/openai/v1
  model: llama-3.3-70b-versatile
  api_key_env: LLM_API_KEY      # name of env variable holding the key (never put keys in yaml)
  temperature: 0.1
  max_tokens: 900
  timeout_seconds: 60

