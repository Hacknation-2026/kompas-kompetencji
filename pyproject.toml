[project]
name = "kompas-kompetencji"
version = "0.1.0"
description = "Kompas Kompetencji – backend wspierający przełożonych w procesie pierwszej oceny i oceny okresowej w służbie cywilnej."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "HackNation 2026 team" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "jinja2>=3.1",
    "fpdf2>=2.7",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# Local neural embeddings (optional, heavy – downloads models into models/).
ml = ["sentence-transformers>=3.0"]
# Tooling used by scripts/ to import source materials (xlsx/docx).
import = ["openpyxl>=3.1", "python-docx>=1.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
kompas = "kompas.__main__:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kompas"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802"]

[tool.mypy]
python_version = "3.11"
packages = ["kompas"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests exercising the HTTP API / multiple layers",
    "slow: long running tests",
]

[tool.coverage.run]
source = ["kompas"]
branch = true
omit = ["src/kompas/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

